[package]
name = "koosreplay"
version = "0.1.0"
description = "KoosReplay gaming clip recorder"
authors = ["KoosReplay"]
edition = "2021"

[lib]
name = "koosreplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

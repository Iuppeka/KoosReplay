name: Build KoosReplay

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Install ImageMagick
        shell: pwsh
        run: |
          choco install imagemagick -y --no-progress

      - name: Generate Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"

          magick convert `
            "src-tauri/icons/koosreplay.svg" `
            -background none `
            -define icon:auto-resize=256,128,64,48,32,16 `
            "src-tauri/icons/icon.ico"

          if (!(Test-Path "src-tauri/icons/icon.ico")) {
            Write-Error "icon.ico was not generated."
            exit 1
          }

          Write-Host "KoosReplay icon generated successfully."

      - name: Build KoosReplay
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: KoosReplay-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
